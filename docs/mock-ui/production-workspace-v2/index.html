<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>試聽與成品 · 完整流程 mock</title><link rel="stylesheet" href="style.css"><div class="app"><header><div class="row"><button onclick="go('map')">流程總覽</button><strong>試聽與成品</strong><span class="muted">靈性開悟 · 互動設計稿</span></div><label>音訊情境 <select id="scenario" onchange="S.taskState=this.value;go(current)"><option value="ready">尚未開始</option><option value="running">執行／等待重試</option><option value="failed">部分失敗</option><option value="cancelled">已取消</option><option value="interrupted">重開後中斷</option><option value="stale">來源或設定改變</option><option value="pending">完成但保存失敗</option><option value="done">成功</option></select></label></header><nav><button id="listToggle" onclick="toggleList()" title="隱藏文件列表" aria-label="隱藏文件列表">‹</button><button data-page="voice" onclick="go('voice')">語音設定與試聽</button><button data-page="audio" onclick="go('audio')">本批音訊與成品</button><button data-page="video" onclick="S.videoScope='batch';go('video')">本批影片</button><button data-page="merge" onclick="go('merge')">全書合併</button><button data-page="versions" onclick="go('versions')">全書成品</button></nav><main id="main"><aside id="files"><div class="row spread"><strong>文件列表</strong><small>3 份</small></div><div class="scroll"><button class="file" onclick="chooseBatch(0)">第一章<small>PDF 1–9 · 音訊待更新</small></button><button class="file" onclick="chooseBatch(1)">第二章<small>PDF 1–2 · 音訊可用</small></button><button class="file active" onclick="chooseBatch(2)">第三章<small>PDF 1–12 · 已確認朗讀稿</small></button></div></aside><section class="workspace"><div class="heading"><div><h1 id="title"></h1><div id="subtitle" class="muted"></div></div><span class="badge">模擬資料 · 無雲端請求</span></div><div id="content"></div><div id="actions"></div></section></main><footer><span id="message" role="status">此 mock 不連線、不製作正式媒體；請勿輸入真實憑證。</span><button id="returnTask" onclick="returnActiveTask()" hidden>返回執行中任務 →</button></footer></div
