osest('details').open=false">AI 設定</button><hr><button onclick="toggleDiff();this.closest('details').open=false">顯示／隱藏差異</button><button onclick="message('選取欲還原的改動後執行（互動示意，未更動文稿）');this.closest('details').open=false">還原游標處改動</button><button onclick="extraTool('discard');this.closest('details').open=false">放棄本次 AI 結果</button></div></details><details class="actionmenu"><summary>版本 ▾</summary><div class="popup"><button onclick="openTool('versions');this.closest('details').open=false">版本紀錄</button><button onclick="extraTool('history');this.closest('details').open=false">開啟歷史 AI 候選</button></div></details></div></div><div class="scroll editor" id="editor" contenteditable="true" role="textbox" aria-label="文稿編輯區" aria-multiline="true"></div></section></div>

<script>
const $=id=>document.getElementById(id);let paragraphs=['開悟不是去拜訪真相，而是你內在的真相醒了過來。','今日今夜與我在一起，你將擁有所有詩歌的源頭。','她剛對我列舉了她靈修旅程的許多層面，現在正等待我的回應。希望是讚同，甚至是誇獎。我恐怕要讓她失望了。我實在很不願意戳破漂亮的年輕女生的希望，但這是我的工作，因為我是個開悟者。','「那麼，你之所以做這些事，」我伸出手指一一數著，「靜心、祈禱、唱誦、做瑜伽、吃素，參拜開悟的聖者，以及捐錢給綠色和平組織，閱讀靈修經典，淨化自己、禁慾，等等，這一切是為了什麼？」','她只是沉默地回望著我，彷彿答案明顯到不用說出來。然而，答案必須說出來，我要把答案擺在面前，讓我們來檢視它，讓我們用小腦袋操控它。','「嗯，你知道的，」她還是不太相信我要她說出這麼明顯的事，「為了靈性成長吧。」'];let prose=paragraphs.map(p=>'<p>'+p+'</p>').join('');$('editor').innerHTML=prose.repeat(4);$('pdftext').innerHTML=prose;let logs=['已載入示範專案'];let saved=false;
function message(s){$('status').textContent=s;logs.push(s)}function fold(){let f=$('workspace').classList.toggle('fold');$('fold').textContent=f?'›':'‹';$('fold').setAttribute('aria-expanded',!f);$('fold').title=f?'顯示文件列表':'隱藏文件列表';$('fold').setAttribute('aria-label',$('fold').title);$('fold').dataset.tip=$('fold').title}function toggleMenu(){let h=$('menu').hidden;$('menu').hidden=!h;$('manage').setAttribute('aria-expanded',h)}function page(n){$('page').value=Math.max(1,Math.min(9,+$('page').value+n));$('folio').textContent=$('page').value;$('pdf').scrollTop=0}function zoom(v){$('paper').style.width=(+v*100)+'%'}function hideSource(){let h=$('compare').classList.toggle('hidepdf');$('sourcebtn').textContent=h?'顯示原稿':'隱藏原稿'}function toggleSource(){$('compare').classList.toggle('show-source')}function back(){$('toolview').hidden=true;$('compare').hidden=false;document.querySelector('header nav button').focus()}function findText(){let term=prompt('搜尋文稿文字','真相');if(term){let text=$('editor').innerText;message('找到 '+(text.split(term).length-1)+' 段相關文字（搜尋示範）')}}function publish(){saved=true;$('next').textContent='前往試聽與製作 →';message('已儲存，可朗讀（示範；未寫入正式專案）')}function runAI(){message('AI 校對示範完成 · 有 1 處建議修改；沒有送出網路請求。');$('editor').querySelector('p').innerHTML='開悟不是去拜訪真相，而是你內在的真相<mark>醒了過來</mark>。'}$('editor').addEventListener('input',()=>{saved=false;$('next').textContent='儲存為朗讀稿';message('文稿已修改 · 尚未儲存為朗讀稿')});function selectFile(el,name){document.querySelectorAll('.file').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');$('summary').textContent=name+' ｜ 示範文件';message('已切換文件選取（共用示範文字）')}$('picker').onchange=()=>message('已選取 '+($('picker').files[0]?.name||'文件')+'（僅示範匯入入口）');
let settings={};function field(label,control){return '<label>'+label+control+'</label>'}function openTool(type){$('compare').hidden=true;$('toolview').hidden=false;$('toolapply').hidden=false;$('toolapply').textContent='保存設定';$('toolapply').onclick=()=>{document.querySelectorAll('#toolscroll input,#toolscroll select').forEach((e,i)=>settings[type+i]=e.value);message('設定已保存（設計稿工作階段）');back()};let title='',intro='',html='';if(type==='ai'){title='AI 設定';intro='校對目前文件全文 · 模型與校對偏好';html='<div class="form">'+field('服務','<select><option>Gemini</option></select>')+field('模型（可自行輸入）','<input value="gemini-2.5-flash" list="models"><datalist id="models"><option>gemini-2.5-flash</option><option>gemini-2.5-pro</option></datalist>')+field('文字字體','<select><option>依文稿判定</option><option>繁體中文</option><option>簡體中文</option><option>保留原樣</option></select>')+field('中文標點','<select><option>統一中文標點</option><option>保留原樣</option></select>')+'<div class="wide note">保留原文語意與文風。疑點保留供人工檢查。</div>'+field('API 金鑰','<input type="password" placeholder="僅示意，不要輸入真實金鑰">')+'<label>連線<button onclick="message(\'連線測試成功（模擬）\')">測試連線</button></label></div>'}else if(type==='source'){title='來源處理';intro='第一章 · PDF 第 1–9 頁';html='<div class="form">'+field('處理範圍','<select><option>目前頁面</option><option>指定頁面</option><option>失敗頁面</option></select>')+field('頁碼','<input value="1–9">')+field('擷取方式','<select><option>自動：優先文字層</option><option>強制 OCR</option></select>')+field('辨識語言','<select><option>繁體中文＋英文</option><option>簡體中文＋英文</option></select>')+field('旋轉','<select><option>不旋轉</option><option>90°</option><option>180°</option><option>270°</option></select>')+'<div class="wide note">重新擷取後先預覽差異，再決定是否套用。人工修改會保留備份。</div></div>';$('toolapply').textContent='預覽重新擷取結果';$('toolapply').onclick=()=>{message('已產生來源差異預覽（模擬），文稿尚未更動。');$('toolscroll').innerHTML='<h3>擷取差異預覽</h3><p>示範結果與目前文稿相同，沒有需要套用的改動。</p>';$('toolapply').hidden=true}}else if(type==='versions'){title='版本紀錄';intro='<label>檢視版本 <select><option>文稿 v71 · 目前已儲存版本</option><option>文稿 v70 · AI 校對前</option></select></label>';html='<h3>相較目前編輯稿</h3><div class="diff"><p>版本紀錄使用完整工作區，長差異只在這個區域捲動。</p>'+prose.repeat(6)+'</div>';$('toolapply').textContent='還原到編輯稿';$('toolapply').onclick=()=>{message('已還原選取版本並備份現稿（模擬）');back()}}else if(type==='original'){title='來源 PDF';intro='原始檔開啟入口示範 · 正式程式使用系統 PDF 閱讀器';html='<div class="paper" style="max-width:700px;margin:auto"><h2>1. 再簡單也不過了</h2>'+prose+'</div>';$('toolapply').hidden=true}else{title='訊息紀錄';intro='本次設計稿操作';html=logs.map(x=>'<p>'+x.replaceAll('<','&lt;')+'</p>').join('');$('toolapply').hidden=true}$('tooltitle').textContent=title;$('toolintro').innerHTML=intro;$('toolscroll').innerHTML=html;$('toolscroll').scrollTop=0;document.querySelectorAll('#toolscroll input,#toolscroll select').forEach((e,i)=>{if(settings[type+i]!==undefined)e.value=settings[type+i]});$('toolview').querySelector('button').focus()}document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('menu').hidden)toggleMenu();else back()}});

function exportText(){const blob=new Blob([$ ('editor').innerText],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='文稿示範.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('已匯出畫面全文 TXT')}
function toggleDiff(){$('editor').classList.toggle('diff-off');message($('editor').classList.contains('diff-off')?'已隱藏差異標記':'已顯示差異標記')}
function extraTool(kind){openTool('log');$('toolapply').hidden=true;const titles={issues:'來源異常',search:'搜尋與取代',cleanup:'整理換行預覽',reload:'重載外部稿',discard:'放棄本次 AI 結果',history:'歷史 AI 候選'};$('tooltitle').textContent=titles[kind];$('toolintro').textContent='目前文件 · 第一章';let body='';if(kind==='issues')body='<h3>目前沒有來源異常</h3><p>正式程式會在此列出缺頁、辨識失敗及待確認頁面，並提供原頁定位。</p>';if(kind==='history')body='<h3>AI 候選紀錄</h3><button onclick="openTool(\'versions\')">檢視上次全文校對候選（示範）</button><p>預覽不會覆蓋目前編輯稿。</p>';if(kind==='search')body='<div class="searchfields"><input id="query" aria-label="搜尋文字" placeholder="搜尋文字"><input id="replacement" aria-label="取代文字" placeholder="取代文字"><button onclick="countQuery()">搜尋</button><button onclick="replaceQuery()">全部取代</button></div><p id="queryresult">輸入文字後搜尋目前編輯稿。全部取代會更新示範文稿。</p>';if(kind==='cleanup')body='<h3>整理前後比較</h3><p>示範稿目前沒有需要合併的多餘空白行；不套用任何變更。</p>';if(kind==='reload')body='<h3>重新載入 TXT</h3><p>正式程式需先備份現稿並預覽差異。本設計稿僅展示選檔入口，不覆蓋編輯內容。</p><button onclick="document.getElementById(\'reloadPicker\').click()">選擇外部 TXT</button>';if(kind==='discard')body='<h3>放棄 AI 結果前先確認範圍</h3><p>正式程式須保護候選中的人工修改，再恢復送出前文字。本設計稿不會丟棄編輯內容。</p>';$('toolscroll').innerHTML=body}
function countQuery(){let q=$('query').value;$('queryresult').textContent=q?'找到 '+($('editor').innerText.split(q).length-1)+' 處':'請輸入搜尋文字'}
function replaceQuery(){let q=$('query').value;if(!q)return;let v=$('replacement').value;const walker=document.createTreeWalker($('editor'),NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode())n.textContent=n.textContent.split(q).join(v);countQuery();message('已取代示範文稿；尚未儲存為朗讀稿');$('next').textContent='儲存為朗讀稿'}
document.addEventListener('click',e=>{document.querySelectorAll('details[open]').forEach(d=>{if(!d.contains(e.target))d.open=false})});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('details[open]').forEach(d=>d.open=false);if(e.ctrlKey&&['f','h'].includes(e.key.toLowerCase())){e.preventDefault();extraTool('search');$('query').focus()}});
</script><input type="file" id="reloadPicker" accept=".txt" hidden onchange="message('已選取外部稿（預覽示意，未覆蓋文稿）')"></html>
