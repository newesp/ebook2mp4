<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>T21 逐格式完成 · UI 草圖</title><style>
:root{font:14px/20px "Microsoft JhengHei",sans-serif;color:#263d34;background:#f5f6f2;--line:#c7d2c6;--green:#315d43}*{box-sizing:border-box}body{margin:0;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}button,select,input{font:inherit;color:inherit}button,select{background:white;border:1px solid var(--line);border-radius:2px;padding:4px 12px;min-height:32px}button{cursor:pointer;white-space:nowrap}button:hover:enabled{background:#e9f0e5}button:active:enabled{transform:translateY(1px)}button:disabled{opacity:.5;cursor:default}button.active,button.primary{background:var(--green);color:white}:focus-visible{outline:2px solid var(--green);outline-offset:2px}h1,h2,p{margin:0}h1,h2{font-size:16px;line-height:24px}small,.muted{color:#58695f}small{font-size:12px;line-height:16px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.grow{flex:1;min-width:0}.demo{padding:4px 16px;background:#e7eddf}.shell{padding:12px 16px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:8px;min-height:0}.workspace{display:grid;grid-template-columns:192px minmax(0,1fr);gap:12px;min-height:0}.sidebar{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:8px;min-height:0}.books,.scroll{overflow:auto;min-height:0;background:white;border:1px solid var(--line)}.book{padding:8px 12px}.book.selected{background:var(--green);color:white}.content{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.page{display:grid;grid-template-rows:auto minmax(80px,1fr) auto auto auto auto auto;gap:8px;min-height:0;min-width:0}.tablewrap{overflow:auto;min-height:0;background:white;border:1px solid var(--line)}table{border-collapse:collapse;table-layout:fixed;width:100%}th,td{padding:8px 12px;text-align:left;overflow-wrap:anywhere;border-bottom:1px solid #dce2d9}th{background:#e9eee6;font-weight:normal;position:sticky;top:0}.ok{color:#315d43}.warn{color:#895c1e}.bad{color:#963b32}.results{border:1px solid var(--line);background:white}.result{display:grid;grid-template-columns:112px 100px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 12px}.result+.result{border-top:1px solid #dce2d9}.summary{padding:8px 12px;background:#edf1e8;border:1px solid var(--line)}.footer{font-size:12px;color:#58695f}.detailpage{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;min-height:0}.scroll{padding:16px}.scroll p{margin-bottom:12px}.scroll h2{margin:16px 0 8px}.scroll h2:first-child{margin-top:0}.kv{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px;margin:12px 0}.kv dt{color:#58695f}.kv dd{margin:0;overflow-wrap:anywhere}.choice{display:flex;align-items:center;gap:4px}progress{width:100%;height:8px;accent-color:var(--green)}[hidden]{display:none!important}.message{min-height:16px}.count{white-space:nowrap}@media(max-width:1100px){.shell{padding:8px 12px}.workspace{grid-template-columns:172px minmax(0,1fr)}.demo small{display:none}.result{grid-template-columns:100px 88px minmax(0,1fr) auto;padding:8px}th,td{padding:8px}}@media(max-width:800px){.workspace{grid-template-columns:136px minmax(0,1fr)}.result{grid-template-columns:88px minmax(0,1fr) auto}.result .reason{grid-column:1/-1;grid-row:2}.sidebar button{white-space:normal}}@media(max-width:560px){.sidebar{display:none}.workspace{grid-template-columns:minmax(0,1fr)}.shell{padding:8px}.demo{padding:4px 8px}.page{grid-template-rows:auto minmax(80px,1fr) auto auto auto auto}.result{grid-template-columns:80px minmax(0,1fr)}.result button{grid-column:2;justify-self:end}.demo strong{display:none}.shell>header button,.shell>nav{display:none}.result .reason{grid-row:auto}.toolbar{gap:4px}button,select{padding:4px 8px}.count{white-space:normal}}
</style></head><body>
<div class="demo row"><strong>T21 草圖 v1</strong><small>範例資料 · 製作、播放、保存及重開均為模擬</small><span class="grow"></span><label>情境 <select id="scenario"><option value="missing">MP3 成功，影片缺項</option><option value="bmissing">MP3 可做，批次影片缺項</option><option value="ready">尚未製作，來源齊全</option><option value="vfail">MP3 成功，影片失敗</option><option value="afail">MP3 失敗，批次影片可合併</option><option value="cancel">MP3 成功，影片已取消</option><option value="stale">來源已變更</option><option value="done">兩格式均完成</option><option value="video">只要 MP4，須先準備總音訊</option><option value="reuse">只要 MP4，重用有效總音訊</option><option value="audio">只要 MP3，沒有視覺素材</option><option value="disk">影片磁碟空間不足</option></select></label><button id="reset">重設</button></div>
<div class="shell"><header class="row"><h1 class="grow">晨間隨筆 · 書籍製作工作台</h1><button disabled>專案 ▾</button><button disabled>版本與檔案 ▾</button><button disabled>儲存校對稿 Ctrl+S</button></header><nav class="row"><button disabled>1 匯入來源</button><button disabled>2 校對文字</button><button disabled>3 確認朗讀稿</button><button class="active" disabled>4 試聽與製作</button></nav>
<div class="workspace"><aside class="sidebar"><h2>書籍與製作批次</h2><small>3 個批次 · A／B 已選入合併</small><div class="books"><p class="book">全書語音預設</p><p class="book selected">A · 第一章 清晨</p><p class="book">B · 第二章 山路</p><p class="book">C · 第三章 歸途</p></div><button disabled>批次管理 ▾</button></aside><main class="content"><div class="toolbar"><nav class="row"><button disabled>語音設定與試聽</button><span>→</span><button disabled>製作與成品</button><span>→</span><button class="active" disabled>全書合併</button></nav><label id="method-label">影片方式 <select id="method"><option value="total">總音訊製片</option><option value="batch">合併既有批次影片</option></select></label></div>
<section id="home" class="page"><div class="toolbar"><nav class="row"><button class="active" disabled>① 合併與輸出</button><span id="visual-arrow">→</span><button id="visual">② 影片素材</button></nav><button id="versions">成品版本 ▸</button></div><div class="tablewrap"><table><colgroup><col style="width:48px"><col style="width:48px"><col><col style="width:72px"><col style="width:30%"></colgroup><thead><tr><th>選取</th><th>順序</th><th>批次</th><th>時長</th><th>來源狀態</th></tr></thead><tbody id="batches"></tbody></table></div>
<div class="row"><span class="grow">2 批 · 1 個接點 · 額外交接停頓 0.5 秒</span><button id="joins">檢查接點 ▸</button><button id="settings">合併設定 ▾</button></div>
<div class="toolbar"><div class="row" role="group" aria-label="要求輸出格式"><strong>要求輸出</strong><label class="choice"><input type="checkbox" id="mp3" checked>總 MP3／SRT</label><label class="choice"><input type="checkbox" id="mp4" checked>總 MP4／SRT</label></div><small id="saved">選擇已儲存（模擬）</small></div>
<div class="results" aria-label="逐格式結果"><div id="audio-row" class="result"><strong id="audio-name">總 MP3／SRT</strong><span id="a-state"></span><span id="a-reason" class="reason muted"></span><button id="a-action">成品操作 ▸</button></div><div id="video-row" class="result"><strong>總 MP4／SRT</strong><span id="v-state"></span><span id="v-reason" class="reason muted"></span><button id="v-action">補齊素材 ▸</button></div></div>
<div class="summary" role="status" aria-live="polite"><div class="row"><strong id="overall" class="grow"></strong><span id="count" class="count"></span></div><p id="next"></p><progress id="progress" max="100" value="0" hidden></progress></div>
<div class="toolbar"><button id="back">← 返回批次製作</button><span class="grow"></span><button id="reopen">模擬重開專案</button><button id="cancel-job" hidden>取消任務</button><button id="start" class="primary">只重試未完成輸出 →</button></div></section>
<section id="detail" class="detailpage" hidden><div class="row"><h2 id="detail-title" class="grow"></h2><span id="detail-status"></span></div><div id="detail-body" class="scroll"></div><div class="row"><button id="detail-back">← 返回合併與輸出</button><span class="grow"></span><button id="detail-action" class="primary"></button></div></section>
</main></div><footer id="message" class="footer message" role="status" aria-live="polite">先看逐格式結果，再補齊缺項或重試。上方可切換示範情境。</footer></div>
<script>
const $=id=>document.getElementById(id);let s, timer=null, page='home', detailKind='';
const labels={ready:'準備',done:'完成',missing:'缺項',failed:'失敗',cancelled:'已取消',stale:'待更新',running:'執行中',waiting:'等待前置'};
function say(t){$('message').textContent=t}
function reset(){clearTimeout(timer);timer=null;const c=$('scenario').value;s={a:'done',v:'missing',mp3:true,mp4:true,method:'total',material:false,batch:true,audio:true,busy:false,attempt:false,progress:0};
if(c==='bmissing')Object.assign(s,{a:'ready',v:'missing',method:'batch',batch:false,audio:false});
if(c==='ready')Object.assign(s,{a:'ready',v:'ready',material:true});
if(['vfail','disk'].includes(c))Object.assign(s,{v:'failed',material:true,attempt:true});
if(c==='afail')Object.assign(s,{a:'failed',v:'ready',method:'batch',attempt:true});
if(c==='cancel')Object.assign(s,{v:'cancelled',material:true,attempt:true});
if(c==='stale')Object.assign(s,{a:'stale',v:'stale',material:true,audio:false});
if(c==='done')Object.assign(s,{v:'done',material:true});
if(c==='video')Object.assign(s,{mp3:false,a:'ready',v:'ready',material:true,audio:false});
if(c==='reuse')Object.assign(s,{mp3:false,v:'ready',material:true});
if(c==='audio')Object.assign(s,{mp4:false,a:'ready',v:'missing',audio:false});
page='home';render();say('已載入示範情境。所有操作均為模擬。')}
function reason(k){const st=s[k];if(st==='running')return k==='a'?'合併既有批次音訊；不呼叫 TTS。':s.method==='total'?'以有效總音訊製片；不再加交接停頓。':'合併 A → B 的批次影片及字幕。';
if(st==='done')return k==='a'?'有效成品保留；相同來源與設定不重做。':'有效影片與同版 SRT 已保存。';
if(st==='stale')return '共用順序已改；上一版保留，需依目前設定更新。';
if(st==='missing')return s.method==='total'?'尚未加入全片圖片或背景 MP4。':'B 批次缺少有效 MP4／SRT。';
if(st==='failed')return k==='a'?'總音訊合併失敗；批次影片仍可獨立合併。':$('scenario').value==='disk'?'輸出磁碟空間不足。請釋放空間後重試。':'影片編碼失敗。成功 MP3 保留，可重試 MP4。';
if(st==='cancelled')return '上次任務已取消；成功成品保留。';
if(st==='waiting')return '等待本次總音訊完成，再以相同設定製片。';
return k==='a'?'A／B 批次音訊有效，可直接合併。':s.method==='total'?(s.audio?'重用有效總音訊，不重新合併 MP3。':'先準備總音訊，再製作 MP4；不呼叫 TTS。'):'A／B 批次影片有效，不需要總音訊或全片素材。'}
function wanted(){return ['a','v'].filter(k=>s[k==='a'?'mp3':'mp4'])}function finished(){return wanted().filter(k=>s[k]==='done').length}
function render(){const want=wanted(),n=finished();$('home').hidden=page!=='home';$('detail').hidden=page==='home';$('mp3').checked=s.mp3;$('mp4').checked=s.mp4;$('method').value=s.method;
$('method-label').hidden=!s.mp4;$('visual').hidden=$('visual-arrow').hidden=!s.mp4||s.method==='batch';
$('batches').innerHTML=['A · 第一章 清晨','B · 第二章 山路','C · 第三章 歸途'].map((name,i)=>`<tr><td>${i<2?'☑':'☐'}</td><td>${i<2?i+1:'—'}</td><td>${name}</td><td>${['03:18','04:27','02:49'][i]}</td><td>${i===2?'未選入':s.method==='batch'&&s.mp4?(i===1&&!s.batch?'影片缺項':'影片有效'):'音訊有效'}</td></tr>`).join('');
for(const k of ['a','v']){$(k==='a'?'audio-row':'video-row').hidden=k==='a'?!(s.mp3||(s.mp4&&s.method==='total'&&!s.audio)):!s.mp4;$(k+'-state').textContent=labels[s[k]];$(k+'-state').className=s[k]==='done'?'ok':['failed','missing'].includes(s[k])?'bad':'warn';$(k+'-reason').textContent=reason(k);$(k+'-action').textContent=s[k]==='done'?'成品操作 ▸':s[k]==='missing'?'補齊缺項 ▸':'查看詳情 ▸';}
$('audio-name').textContent=s.mp3?'總 MP3／SRT':'前置總音訊';
$('count').textContent=want.length?`${n}／${want.length} 個要求格式完成`:'';
$('overall').textContent=s.busy?'處理中':!want.length?'請選擇輸出格式':n===want.length?'全部要求已完成':n?'部分完成':want.some(k=>s[k]==='failed')?'未完成 · 有格式失敗':want.some(k=>s[k]==='cancelled')?'未完成 · 已取消':want.some(k=>s[k]==='stale')?'未完成 · 來源待更新':'尚未完成';
$('next').textContent=s.busy?'本專案循序執行一個產出任務。成功格式會立即保存。':!want.length?'至少選擇一種輸出。':n===want.length?'各要求格式與其 SRT 皆有效；可從成品操作播放或另存。':s.mp4&&s.v==='missing'?(s.mp3&&s.a!=='done'?'可先完成總 MP3／SRT。影片缺項不阻擋音訊。':'先補齊影片缺項，再重試 MP4；有效 MP3 保留。'):s.method==='total'&&s.mp4&&!s.audio?'先準備總音訊，再製作 MP4；來源與設定一致時只做一次。':'只處理未完成或待更新的格式；有效成品保留。';
for(const id of ['mp3','mp4','method','reset','scenario','reopen','visual','joins','settings','back','versions','a-action','v-action'])$(id).disabled=s.busy;
$('start').disabled=s.busy||!want.length||n===want.length||(s.v==='missing'&&(!s.mp3||s.a==='done'));
$('start').textContent=s.busy?'製作中…':n===want.length&&want.length?'輸出均已完成':s.mp4&&s.v==='missing'&&s.mp3&&s.a!=='done'?'先製作可用的 MP3 →':s.attempt||n>0?'只重試未完成輸出 →':'製作所選輸出 →';
$('cancel-job').hidden=!s.busy;$('progress').hidden=!s.busy;$('progress').value=s.progress;
}
function showDetail(kind){detailKind=kind;page='detail';render();$('detail-status').textContent='草圖 · 模擬操作';const isMaterial=kind==='material'||kind==='v'&&s.v==='missing';
if(isMaterial){$('detail-title').textContent=s.method==='total'?'影片素材 · 總音訊製片':'影片缺項 · 批次影片合併';$('detail-body').innerHTML=s.method==='total'?'<h2>全片視覺素材</h2><p>可加入或更換一張圖片或一支背景 MP4，套用到整部影片。</p><div class="row"><label>素材類型 <select><option>背景 MP4</option><option>圖片 JPEG／PNG</option></select></label><label>短片處理 <select><option>循環</option><option>最後一格定格</option></select></label><label>解析度 <select><option>1080p</option><option>720p</option></select></label></div><h2>來源與預覽</h2><p>示範素材：林間步道.mp4。背景原聲靜音，畫面保持比例。</p><p>正式版沿用既有素材頁的選檔及預覽。這裡只模擬補齊素材。</p>':'<h2>B · 第二章 山路</h2><p>缺少有效批次 MP4／SRT。先到該批製作影片，再返回合併。</p><p>這條路徑不要求總 MP3 或全片視覺素材。總 MP3 的失敗不阻擋有效批次影片合併。</p>';$('detail-action').textContent=s.method==='total'?'模擬加入素材並返回 →':'模擬補齊 B 批次影片 →';
}else if(['a','v','versions'].includes(kind)){const k=kind==='a'?'a':'v';$('detail-title').textContent=kind==='versions'?'成品版本 · 沿用 T20 入口':k==='a'?'總 MP3／SRT':'總 MP4／SRT';$('detail-body').innerHTML=`<h2>${labels[s[k]]}</h2><p>${reason(k)}</p><dl class="kv"><dt>來源</dt><dd>${k==='a'?'A 音訊 v2 → B 音訊 v1':s.method==='total'?'有效總音訊 ＋ 全片背景':'A 影片 v2 → B 影片 v1'}</dd><dt>共用設定</dt><dd>A → B · 交接停頓 0.5 秒</dd><dt>成功成果</dt><dd>${s[k]==='done'?'成品及同版 SRT 已保存。':'上一版（若有）保留；本次不冒充完成。'}</dd></dl><details><summary>技術資訊與錯誤紀錄</summary><p>正式版沿用 T20 來源快照、版本及診斷資訊。此處為示意。</p></details><h2>成品操作</h2><div class="row"><button id="play" ${s[k]==='done'?'':'disabled'}>模擬播放</button><button id="export" ${s[k]==='done'?'':'disabled'}>模擬另存成品／SRT</button></div>`;$('detail-action').textContent='返回查看所有輸出 →';for(const id of ['play','export'])$(id).onclick=()=>say('模擬'+(id==='play'?'播放':'另存')+'所選格式及同版 SRT，沒有產生檔案。');
}else{$('detail-title').textContent=kind==='joins'?'交接接點 · 沿用既有頁面':'合併設定 · 沿用既有頁面';$('detail-body').innerHTML='<h2>共用選取、順序與交接停頓</h2><p>A → B，額外停頓 0.5 秒。這份草圖聚焦 T21 的輸出選擇與結果。</p><p>正式版沿用目前的排序、設定及接點預覽，返回保留輸入。</p>';$('detail-action').textContent='返回合併與輸出 →';}}
function run(){if($('start').disabled)return;s.busy=true;s.attempt=true;const queue=[];if(s.mp3&&s.a!=='done'||s.mp4&&s.method==='total'&&!s.audio)queue.push('a');if(s.mp4&&s.v!=='done'&&s.v!=='missing')queue.push('v');if(queue.includes('a')&&queue.includes('v')&&s.method==='total')s.v='waiting';
function step(){if(!queue.length){s.busy=false;render();say('模擬任務已停止。各格式結果已獨立保存；沒有製作實際檔案。');return}const k=queue.shift();s.current=k;s[k]='running';s.progress=20;render();timer=setTimeout(()=>{if(k==='a'&&$('scenario').value==='afail'){s.a='failed';}else if(k==='v'&&$('scenario').value==='disk'){s.v='failed';}else{s[k]='done';if(k==='a')s.audio=true}s.progress=100;render();timer=setTimeout(step,500)},1800)}step()}
$('scenario').onchange=$('reset').onclick=reset;
for(const k of ['mp3','mp4'])$(k).onchange=()=>{s[k]=$(k).checked;render();say('輸出選擇已儲存（模擬）。不刪除未選格式的既有成品。')};
$('method').onchange=()=>{s.method=$('method').value;s.v=s.method==='total'?(s.material?'ready':'missing'):(s.batch?'ready':'missing');render();say('已切換影片路徑。共用選取與交接停頓保留。')};
$('visual').onclick=()=>showDetail('material');$('versions').onclick=()=>showDetail('versions');$('a-action').onclick=()=>showDetail('a');$('v-action').onclick=()=>showDetail('v');$('joins').onclick=()=>showDetail('joins');$('settings').onclick=()=>showDetail('settings');
$('detail-back').onclick=()=>{page='home';render()};$('detail-action').onclick=()=>{if(detailKind==='material'||detailKind==='v'&&s.v==='missing'){s.material=true;s.batch=true;s.v='ready';say('缺項已補齊（模擬）。返回後只需執行未完成格式。')}page='home';render()};
$('start').onclick=run;$('cancel-job').onclick=()=>{clearTimeout(timer);timer=null;s[s.current]='cancelled';if(s.v==='waiting')s.v='cancelled';s.busy=false;render();say('任務已取消（模擬）。已完成的格式及 SRT 保留。')};
$('reopen').onclick=()=>{const saved=JSON.stringify(s);s=JSON.parse(saved);render();say('模擬重開：保留所選格式、路徑及結果。正式版仍須重新檢查檔案與來源有效性。')};$('back').onclick=()=>say('模擬返回批次製作；合併選取、順序及輸出選擇保留。');reset();
</script></body></html>
