<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>影片製作 · 整合工作區 mock</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><header><div class="nav"><button onclick="contextPage('文稿')">1 文稿</button><button class="selected" onclick="contextPage('試聽與製作')">2 試聽與製作</button><i></i><button onclick="contextPage('語音設定與試聽')">語音設定與試聽</button><span>→</span><button onclick="contextPage('音訊製做')">音訊製做</button><span>→</span><button onclick="enterBook()">全書合併</button><i></i><button class="active" aria-current="page" onclick="render()">影片製作</button></div><div class="nav"><small>靈性開悟 · 互動 mock</small><button onclick="showPanel('results')">成品</button></div></header>
<div class="toolbar"><button id="listToggle" onclick="toggleFiles()" aria-expanded="false" title="顯示文件列表">顯示文件列表</button><label>製作範圍 <select id="scope" onchange="setScope(this.value)"><option value="batch">本批 · 第三章</option><option value="book">全書</option></select></label><label id="methodLabel">影片方式 <select id="method" onchange="setMethod(this.value)"><option value="total">統一素材製片</option><option value="merge">沿用各批影片</option></select></label><span id="context" class="grow"></span><button onclick="showPanel('sources')">來源與製作設定</button></div>
<main id="workspace" class="fold"><aside id="files"><strong>文件列表</strong><div class="scroll"><button onclick="selectBatch(0)">第一章<small>音訊待更新 · 影片可用</small></button><button onclick="selectBatch(1)">第二章<small>音訊／影片可用</small></button><button onclick="selectBatch(2)">第三章<small>音訊可用 · 影片缺少</small></button></div></aside><section class="work"><nav class="tabs"><button data-panel="preview" onclick="showPanel('preview')">畫面與素材</button><button data-panel="sources" onclick="showPanel('sources')">來源與順序</button><button data-panel="results" onclick="showPanel('results')">任務與成品</button><span class="grow"></span><button id="activeTask" hidden onclick="returnTask()">返回進行中任務</button><small>示範資料 · 不產生媒體</small></nav><div id="content"></div></section></main>
<div class="status"><span id="statusText" role="status" class="grow"></span><button onclick="showPanel('results')">狀態詳情</button></div><div class="footer"><div class="nav"><button id="back" onclick="contextPage(scope==='batch'?'音訊製做':'全書合併')">← 音訊製做</button><button id="save" onclick="save()">保存製作設定</button><span id="savedLabel"></span></div><div class="nav"><button id="play" onclick="playProduct()">播放成品</button><select id="productAction" aria-label="成品操作" onchange="productAction(this.value);this.value='' "><option value="">成品操作</option><option value="stop">停止播放</option><option value="export">另存 MP4／SRT</option><option value="folder">開啟資料夾</option><option value="source">查看成品來源</option></select><button id="cancel" hidden onclick="finish('cancelled')">取消任務</button><button id="start" class="primary" onclick="start()">製作 MP4／SRT</button></div></div></div><script src="app.js"></script></body></html>
