<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>試聽與製作 · 工作區設計</title><style>
:root{--g:#315d43;--bg:#f4f6f2;--border:#dce3dc;--ink:#24382d;--muted:#637168}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px 'Microsoft JhengHei',sans-serif}button,select,input{font:inherit;color:inherit}button,select,input[type=number]{height:36px;border:1px solid var(--border);background:white;border-radius:4px;padding:0 12px}button{cursor:pointer;white-space:nowrap}button:hover{background:#e7eee4}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--g);color:white}.primary:hover{background:#254d34}.active{background:#e0eadc;border-color:#acc3ac}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--g);outline-offset:3px}input[type=checkbox]{accent-color:var(--g);width:16px;height:16px;vertical-align:middle}.app{height:100dvh;display:grid;grid-template-rows:56px 1fr 48px;padding:0 16px;gap:12px}.row{display:flex;align-items:center;gap:8px}.spread{justify-content:space-between}.muted,small{color:var(--muted)}small{font-size:12px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px}header{border-bottom:1px solid var(--border)}footer{border-top:1px solid var(--border)}main{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;min-height:0}main.fold{grid-template-columns:1fr}main.fold aside{display:none}aside{display:grid;grid-template-rows:44px 1fr;min-height:0}.scroll{overflow:auto;overscroll-behavior:contain;min-height:0}.list{border:1px solid var(--border);border-radius:4px;background:white;padding:8px}.file{width:100%;height:auto;text-align:left;padding:16px 12px;margin-bottom:8px}.file b,.file small{display:block}.file small{margin-top:8px}.stage{display:grid;grid-template-rows:44px auto minmax(0,1fr) auto;min-width:0;min-height:0;gap:12px}.tabs{display:flex;gap:8px;align-items:center}.tabs .reopen{display:none}.fold .reopen{display:block}.headline{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:22px;margin:0 0 6px}h2{font-size:16px;margin:0}p{line-height:1.7}.card{border:1px solid var(--border);border-radius:6px;background:white;padding:20px}.content{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.left{display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;min-height:0}.progress{display:grid;gap:16px}progress{width:100%;height:12px;accent-color:var(--g)}.badge{padding:4px 8px;border-radius:4px;background:#e7eee4;font-size:12px;white-space:nowrap}.warning{background:#fff3d8;color:#79500b}.error{background:#fce8e5;color:#8b3029}.tablebox{border:1px solid var(--border);background:white;border-radius:6px;overflow:auto;min-height:0;overscroll-behavior:contain}table{border-collapse:collapse;width:100%;text-align:left}th{position:sticky;top:0;background:#eef2ec;font-weight:500;z-index:1}th,td{padding:12px 16px;border-bottom:1px solid var(--border)}td p{margin:0}td small{display:block;margin-top:4px}.selected{background:#eff5eb}.side{display:grid;align-content:start;gap:16px;overflow:auto;min-height:0}.side p{margin:12px 0}.side button{width:100%;margin-top:8px}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--border)}.status{font-size:12px}.demo{font-size:12px;background:transparent}.details{display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;min-height:0}.preview{white-space:pre-wrap;line-height:1.9;font-size:17px}.panel{grid-column:1/-1;display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;background:white;border:1px solid var(--border);border-radius:6px}.panelhead,.panelbottom{padding:16px 24px}.panelhead{border-bottom:1px solid var(--border)}.panelbody{padding:24px}.panelbottom{border-top:1px solid var(--border)}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:760px}.form label{display:grid;gap:8px}.form input{width:100%}.empty{padding:32px;text-align:center;color:var(--muted)}[hidden]{display:none!important}@media(max-width:1100px){main{grid-template-columns:184px 1fr}.content{grid-template-columns:minmax(0,1fr) 260px}.card{padding:16px}th,td{padding:12px 8px}}@media(max-width:850px){.content{grid-template-columns:1fr;overflow:auto}.side{overflow:visible}.left{min-height:330px}.headline{flex-wrap:wrap}.actions{flex-wrap:wrap}.app{grid-template-rows:64px 1fr 64px}.tabs{flex-wrap:wrap}main{grid-template-columns:160px 1fr}.stage{grid-template-rows:auto auto minmax(0,1fr) auto}.form{grid-template-columns:1fr}}@media(max-width:620px){main{grid-template-columns:1fr}aside{display:none}.tabs .reopen{display:block}header .muted{display:none}.app{padding:0 8px}.tabs button{padding:0 6px}.actions .row{flex-wrap:wrap}}
.side{grid-template-rows:none}@media(max-width:850px){.content{overflow:hidden;grid-template-rows:minmax(0,1fr) 210px}.side{overflow:auto;display:flex;align-items:stretch}.side .card{flex:1;min-width:240px}.left{min-height:0}.panel{grid-row:1/-1}} </style><div class="app"><header><div class="row"><button onclick="notice('文稿頁沿用已核准第六版設計')">1 文稿</button><button class="active">2 試聽與製作</button></div><div class="row"><span class="muted">靈性開悟 · 互動設計稿</span><button onclick="notice('專案操作入口（示範）')">專案 ▾</button></div></header><main id="main"><aside><div class="row spread"><button title="隱藏文件列表" aria-label="隱藏文件列表" onclick="fold()">‹</button><button onclick="notice('匯入文稿入口（示範）')">匯入 ▾</button><button onclick="notice('文件命名、排序及移除入口（示範）')">管理 ▾</button></div><div class="scroll list"><button class="file" onclick="notice('第一章音訊待更新；請先更新朗讀稿或語音製作。')"><b>第一章</b><small>PDF 1–9</small><small>音訊待更新</small></button><button class="file" onclick="notice('第二章音訊有效，可加入合併。')"><b>第二章</b><small>PDF 1–2</small><small>音訊可用 · 02:14</small></button><button class="file active" onclick="go('produce')"><b>第三章</b><small>PDF 1–12</small><small id="fileState">製作中 · 7 / 251</small></button></div></aside><section class="stage"><nav class="tabs"><button class="reopen" title="顯示文件列表" aria-label="顯示文件列表" onclick="fold()">›</button><button onclick="panel('voice')">語音設定與試聽</button><span>→</span><button id="prodTab" class="active" onclick="go('produce')">製作成品</button><span>→</span><button id="mergeTab" onclick="go('merge')">全書合併</button></nav><div class="headline"><div><h1 id="title">製作第三章音訊</h1><small id="subtitle">目前朗讀稿 v71 · MP3 音訊與 SRT 字幕</small></div><label class="row demo">示範狀態 <select id="scenario" onchange="setState(this.value)"><option value="running">製作中／等待重試</option><option value="ready">尚未開始</option><option value="failed">部分失敗</option><option value="done">製作成功</option><option value="cancelled">已取消</option></select></label></div><div class="content" id="content"></div><div class="actions" id="actions"></div></section></main><footer><span id="message" class="status" role="status">本設計稿使用模擬資料，不送出文字、不產生正式成品。</span><button class="demo" id="taskLink" onclick="go('produce')">第三章製作中 · 返回任務 →</button></footer></div>
<script>
const $=id=>document.getElementById(id);let view='produce',state='running',consent=true,selected=[true,true,false],focusRow=0,order=[0,1,2],fixed=false;const names=['第一章','第二章','第三章'];function busy(){return state==='running'}function notice(t){$('message').textContent=t}function fold(){const on=$('main').classList.toggle('fold');notice(on?'文件列表已隱藏，內容區已填滿':'文件列表已展開')}function go(v){view=v;render()}function setState(v){state=v;$('scenario').value=v;render()}function btn(t,fn,cls='',disabled=false){return '<button class="'+cls+'" onclick="'+fn+'" '+(disabled?'disabled':'')+'>'+t+'</button>'}function render(){$('prodTab').classList.toggle('active',view==='produce');$('mergeTab').classList.toggle('active',view==='merge');$('taskLink').hidden=!busy()||view==='produce';$('fileState').textContent=busy()?'製作中 · 7 / 251':state==='done'?'音訊可用':'尚無有效音訊';$('title').textContent=view==='produce'?'製作第三章音訊':'全書合併';$('subtitle').textContent=view==='produce'?'目前朗讀稿 v71 · MP3 音訊與 SRT 字幕':'選取有效批次 → 調整順序與接點 → 製作所選輸出';view==='produce'?production():merge()}
function production(){let labels={running:'等待重試',ready:'準備製作',failed:'部分失敗',done:'製作完成',cancelled:'已取消'};let info={running:'區塊 8 暫時無法連線，5 秒後重試。已完成內容會保留。',ready:'將依目前朗讀快照與語音設定製作。',failed:'1 個區塊失敗，其餘成功結果已保留。',done:'MP3 與 SRT 已完成並驗證，可播放或製作影片。',cancelled:'任務已停止，已完成 7 個區塊可供續作。'};let rows=Array.from({length:40},(_,i)=>'<tr><td>'+ (i+1)+'</td><td>'+ (state==='done'||i<7?'已完成':i===7?(state==='failed'?'失敗':busy()?'等待重試':'未完成'):'等待')+'</td><td>'+ (i<8?'1':'0')+'</td><td>'+ (i===7&&busy()?'連線暫時中斷':'—')+'</td></tr>').join('');$('content').innerHTML='<div class="left"><section class="card progress"><div class="row spread"><h2>'+labels[state]+'</h2><span class="badge '+(state==='failed'?'error':busy()?'warning':'')+'">'+(state==='done'?'251 / 251':state==='ready'?'0 / 251':'7 / 251')+' 區塊</span></div><progress max="251" value="'+(state==='done'?251:state==='ready'?0:7)+'" aria-label="完成區塊進度"></progress><div>'+info[state]+'</div></section><div class="details"><div class="row spread"><h2>區塊明細</h2><label>顯示 <select onchange="filterRows(this.value)"><option>全部</option><option>需處理</option></select></label></div><div class="tablebox"><table><thead><tr><th>區塊</th><th>狀態</th><th>嘗試</th><th>說明</th></tr></thead><tbody id="chunks">'+rows+'</tbody></table></div></div></div><aside class="side"><section class="card"><h2>本次製作</h2><p>第三章 · 目前朗讀稿 v71<br><span class="muted">251 個區塊 · 固定任務快照</span></p>'+btn('查看朗讀稿',"panel('text')")+btn('任務與語音設定',"panel('settings')")+'</section><section class="card"><h2>批次成品</h2>'+(state==='done'?'<p>MP3 ／ SRT<br><span class="badge">已驗證 · 24:25</span></p>'+btn('播放／停止',"notice('播放控制示範，未載入實際音檔')")+btn('另存成品',"notice('另存 MP3／SRT 入口（示範）')")+btn('開啟資料夾',"notice('成品資料夾入口（示範）')")+btn('加入素材，製作 MP4 →',"panel('video')",'primary'):'<p class="muted">尚無本次成功成品。完成後可播放、另存或製作影片。</p>')+'</section></aside>';
let primary=busy()?btn('取消任務',"setState('cancelled')"):(state==='done'?btn('前往全書合併 →',"go('merge')",'primary'):btn(state==='ready'?'開始製作 MP3 / SRT':'續作未完成區塊',"setState('running')",'primary',!consent));$('actions').innerHTML='<div class="row">'+btn('← 語音設定',"panel('voice')",'',busy())+(!busy()&&state!=='done'?'<label><input type="checkbox" '+(consent?'checked':'')+' onchange="consent=this.checked;render()">同意傳送待處理文字（可能計費）</label>':'')+'</div><div class="row">'+(!busy()&&state!=='ready'&&state!=='done'?btn('重新開始…',"panel('restart')"):'')+primary+'</div>';}
function filterRows(v){document.querySelectorAll('#chunks tr').forEach(r=>r.hidden=v==='需處理'&&!/失敗|重試/.test(r.textContent))}
function merge(){let count=selected.filter(Boolean).length,invalid=selected.some((s,i)=>s&&!valid(i));let rows=order.map((i,pos)=>'<tr class="'+(focusRow===i?'selected':'')+'"><td><input type="checkbox" aria-label="選取'+names[i]+'" '+(selected[i]?'checked':'')+' onchange="selected['+i+']=this.checked;render()"></td><td>'+ (pos+1)+'</td><td>'+btn(names[i], 'focusRow='+i+';render()')+'</td><td>'+(i===0?'24:25':i===1?'02:14':state==='done'?'24:25':'—')+'</td><td><span class="badge '+(!valid(i)?'warning':'')+'">'+(valid(i)?'可合併':i===0?'待更新':'缺少成品')+'</span>'+(!valid(i)?'<small>'+(i===0?'朗讀稿或語音設定已變更':'尚無有效 MP3 / SRT')+'</small>':'')+'</td></tr>').join('');$('content').innerHTML='<div class="left" style="grid-template-rows:auto minmax(0,1fr)"><div class="row spread"><h2>批次與順序</h2><div class="row">'+btn('選取有效批次','selectValid()')+btn('上移','move(-1)','',order.indexOf(focusRow)===0)+btn('下移','move(1)','',order.indexOf(focusRow)===order.length-1)+'</div></div><div class="tablebox"><table><thead><tr><th>選取</th><th>順序</th><th>批次</th><th>時長</th><th>來源狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div><aside class="side"><section class="card"><h2>合併設定</h2><p>已選 '+count+' 批</p><label>批次間額外停頓 <input type="number" value="0.5" min="0" max="5" step="0.1" style="width:76px" aria-label="批次間停頓秒數"> 秒</label><p class="muted">保留原音訊頭尾，末批不補停頓。</p>'+btn('檢查相鄰接點',"panel('joins')",'',count<2)+'<p><label><input type="checkbox" checked disabled>總 MP3 / SRT</label></p>'+btn('影片輸出選項',"panel('video')")+'</section><section class="card"><h2>製作前檢查</h2><p>'+(busy()?'第三章製作任務仍在執行，結束或取消後才能合併。':invalid?'所選批次有待更新或缺少成品。':count?'所選批次有效，可以合併。':'請至少選取一個有效批次。')+'</p>'+(invalid?btn('查看與補齊缺項',"panel('missing')"):'')+(busy()?btn('返回執行中任務 →',"go('produce')"):'')+'</section></aside>';$('actions').innerHTML=btn('← 返回批次製作',"go('produce')")+'<div class="row"><span class="muted">'+(busy()?'等待目前任務結束':invalid?'先處理來源缺項':count+' 批已就緒')+'</span>'+btn('合併音訊與字幕 →',"panel('merged')",'primary',busy()||invalid||!count)+'</div>'}
function valid(i){return i===1||(i===0&&fixed)||(i===2&&state==='done')}function selectValid(){selected=names.map((_,i)=>valid(i));render()}function move(d){let p=order.indexOf(focusRow),q=p+d;if(q<0||q>=order.length)return;[order[p],order[q]]=[order[q],order[p]];render()}
function panel(type){let titles={voice:'語音設定與試聽',text:'朗讀稿預覽',settings:'任務與設定詳情',video:'製作影片',joins:'檢查接點',missing:'待處理批次',restart:'重新開始製作',merged:'合併完成'};let html='',action='';if(type==='text')html='<div class="preview">'+('我們對老師與教誨的忠誠，反映的並不是他們的價值，而是我們假我的自我想要存活下去的執著。\n\n為了與我成千上萬的臉孔相遇，我漫遊世界。\n\n').repeat(30)+'</div>';if(type==='settings'||type==='voice')html='<div class="form"><label>語音服務<select><option>目前服務</option></select></label><label>音色<select><option>目前選定音色</option></select></label><label>語速<select><option>正常</option><option>慢 10%</option></select></label><label>任務來源<input type="text" value="朗讀稿 v71 · 固定快照" readonly></label></div><p>示範頁。執行中設定唯讀；變更未來設定不影響目前任務快照。</p>'+btn('播放範例',"notice('試聽入口示範，沒有雲端請求')",'',busy());if(type==='video')html='<h2>選擇影片來源</h2><p><label><input type="radio" name="method" checked>使用總音訊製片</label></p><p><label><input type="radio" name="method">合併既有批次影片</label></p><p>總音訊製片需要有效總 MP3 / SRT，再搭配圖片或影片；沿用音訊，不重新呼叫 TTS。</p>'+btn('選擇視覺素材',"notice('素材選取入口示範')")+'<p class="muted">影片設定及生成不在本次 mock 的完整互動範圍內。</p>';if(type==='joins')html='<h2>相鄰批次接點</h2><p>前批末句：讓我們回到此刻。</p><p>後批首句：新的旅程從這裡開始。</p><p>額外停頓：0.5 秒。可返回文稿修正，合併不自動去重或補字。</p>';if(type==='missing'){html='<h2>第一章 · 待更新</h2><p>朗讀稿或語音設定已變更，需重新製作音訊。</p><h2>第三章 · 尚無有效成品</h2><p>等待任務完成，或取消選取此批。</p>';action=btn('模擬第一章更新完成','fixed=true;render()')}if(type==='restart'){html='<p>重新開始會建立新任務。正式程式須說明重做與可能計費範圍，保留上一份成功成品。</p>';action=btn('確認重新開始（示範）',"setState('running')",'primary',!consent)}if(type==='merged')html='<h2>總 MP3 / SRT 已完成（示範）</h2><p>音訊與字幕使用同一批次順序及接點設定。</p>'+btn('播放總音訊',"notice('播放示範，未載入音檔')")+' '+btn('製作影片 →',"panel('video')",'primary');$('content').innerHTML='<section class="panel"><div class="panelhead row spread"><h2>'+titles[type]+'</h2>'+btn('返回', 'render()')+'</div><div class="panelbody scroll">'+html+'</div><div class="panelbottom row spread">'+btn('← 返回工作區','render()')+action+'</div></section>';$('actions').innerHTML='<span class="muted">返回後保留批次選取與順序。</span>';if(busy())document.querySelectorAll('.panelbody select,.panelbody input').forEach(e=>e.disabled=true)}render();
</script></html>
